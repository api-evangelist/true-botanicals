apis:
- name: True Botanicals UCP Agent Commerce (MCP)
  description: 'The Universal Commerce Protocol shopping service True Botanicals serves at its own domain. A POST
    to /api/ucp/mcp answers an unauthenticated MCP tools/list with 13 tools — search_catalog, lookup_catalog,
    get_product, create_cart, get_cart, update_cart, cancel_cart, create_checkout, get_checkout, update_checkout,
    complete_checkout, cancel_checkout and get_order — each carrying a JSON Schema 2020-12 inputSchema. Checkout
    completion requires contemporaneous human approval; the store states this in both robots.txt and llms.txt.'
  humanURL: https://truebotanicals.com/agents.md
  baseURL: https://truebotanicals.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - MCP
  - UCP
  - Retail
  properties:
  - type: MCPServer
    url: mcp/true-botanicals-mcp.yml
  - type: ToolCrosswalk
    url: mcp/true-botanicals-tool-crosswalk.yml
  - type: Documentation
    url: https://truebotanicals.com/agents.md
- name: True Botanicals Storefront GraphQL (Shopify)
  description: 'The Shopify Storefront GraphQL API as served on True Botanicals'' own domain. Introspection and
    catalog queries answered keyless on 2026-08-30 (424 types; shop.name returned "True Botanicals"), so the
    endpoint is a live, callable read surface over this merchant''s catalog. The schema itself is version 2026-01
    of Shopify''s platform Storefront API, identical across Shopify merchants — recorded here as served by this
    host, not as a contract True Botanicals authored.'
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://truebotanicals.com/api/2026-01/graphql.json
  tags:
  - GraphQL
  - Retail
  - E-Commerce
  properties:
  - type: GraphQL
    url: graphql/true-botanicals-graphql.yml
