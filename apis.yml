aid: true-botanicals
name: True Botanicals
description: 'True Botanicals is a clean-luxury skincare company selling clinically tested, MADE SAFE certified
  face and body products direct to consumers from truebotanicals.com. It is not a developer-tools company and
  publishes no developer portal, API keys or SDKs; its machine-readable surface is the agent-commerce layer its
  Shopify storefront exposes on its own domain — an llms.txt and agents.md at the site root, a Universal Commerce
  Protocol (UCP) merchant profile at /.well-known/ucp, an unauthenticated MCP endpoint at /api/ucp/mcp serving 13
  catalog, cart, checkout and order tools, a keyless Shopify Storefront GraphQL endpoint, and OAuth 2.0 /
  OpenID Connect discovery documents for Shopify customer accounts. Every artifact in this repo was probed live
  from truebotanicals.com; the schemas behind them are platform-authored by Shopify and shared with every Shopify
  merchant, and are recorded here as served, not as contracts True Botanicals authored.'
