notes:
- 'Client registration for the customer-accounts authorization server is not open — the discovery document
  publishes no registration_endpoint, and Shopify issues client ids through the merchant admin. Third parties
  cannot self-serve credentials against this issuer.'
- 'No api-key, http-bearer or mutualTLS scheme is documented or observed anywhere on this provider''s surface.'
- 'An agent that wants to transact here must itself publish a UCP agent profile at a fetchable URI — the
  authentication burden sits on the caller''s discoverability, not on a credential the merchant issues.'
- 'The JWT that get_order demands is minted through Shopify''s agent authentication flow, documented at
  https://shopify.dev/docs/agents/get-started/authentication — a Shopify-platform credential, not a
  True Botanicals one.'
