domain_standard:
  id: ucp
  market: agentic retail commerce
  declared_in_contract: true
  evidence: 'The contract declares the standard rather than a marketing page claiming it: /.well-known/ucp is
    a UCP merchant profile whose service identifier is the UCP namespace dev.ucp.shopping, whose capability
    identifiers are the UCP namespaces dev.ucp.shopping.checkout / .cart / .fulfillment / .discount / .order /
    .catalog.search / .catalog.lookup, and whose schema pointers resolve to ucp.dev/2026-08-25/schemas/shopping/*.
    The MCP endpoint echoes it back as the response header x-shopify-ucp-mcp-api-version: 2026-08-25.'
  extension: 'One vendor extension is declared alongside the standard ones — dev.shopify.catalog, which extends
    dev.ucp.shopping.catalog.search and .lookup and requires protocol >= 2026-08-25.'
  buyer_note: 'An agent that already speaks UCP can search, cart and check out here with no bespoke connector.
    That is platform-conferred: every Shopify merchant gets it, so it distinguishes the platform more than it
    distinguishes True Botanicals.'
certifications:
  published: false
  note: 'No SOC 2, ISO 27001, PCI DSS or other infosec certification is published by True Botanicals; no trust
    centre and no security disclosure programme were found (probe-security-programs.py: vdp=none trust=none).
    The company does publish a product-safety certification, MADE SAFE, which is a cosmetics-ingredient
    certification and not an information-security or API compliance programme — it is recorded here so nobody
